<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagnóstico v3</title>
<style>
html, body { margin: 0; overflow: hidden; }
body { font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
#fondo { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
/* Capa grande (150 %) fija: se conmuta en cada toque con el truco K. */
#fondo.grande { position: fixed; top: -25vh; left: -25vw; width: 150vw; height: 150vh; min-height: 0; }
#fondo b { font-size: 11vw; }
#fondo small { font-size: 4.5vw; opacity: .85; margin-top: .6em; }
/* Cronómetro de tamaño fijo: cambia el texto, no la geometría. */
#crono { font: 700 9vw/1 ui-monospace, Menlo, monospace; width: 6ch; margin-top: .5em; }
#log { position: fixed; left: 8px; right: 8px; bottom: 150px; font-size: 12px; opacity: .75; text-align: center; word-break: break-all; }
#barra { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.78); }
#barra button { font: 600 13px/1.15 -apple-system, system-ui, sans-serif; padding: 12px 3px; border: 0; border-radius: 10px; background: #fff; color: #000; -webkit-tap-highlight-color: transparent; }
#barra button.on { background: #ffd400; }
</style>
</head>
<body>
<div id="fondo"><b id="color">—</b><small id="truco">toca un botón</small><div id="crono">0.0 s</div></div>
<div id="log"></div>
<div id="barra">
  <button data-t="0">0<br>nada</button>
  <button data-t="F">F<br>ref (1s?)</button>
  <button data-t="G">G<br>síncrono</button>
  <button data-t="H">H<br>theme+F</button>
  <button data-t="K">K<br>150% cada vez</button>
  <button data-t="J">J<br>al tocar</button>
  <button data-t="I">I<br>auto 300ms</button>
  <button data-t="R">R<br>reset</button>
</div>
<script>
(function () {
  var PAL = [['azul','#0017C3'],['rosa','#FFA3DC'],['lima','#BFED34'],['rojo','#FF3E3E'],['cian','#49FFED'],['magenta','#FF27EC'],['negro','#000000'],['blanco','#FFFFFF']];
  var i = 0, t0 = 0, auto = null, meta = null;
  var body = document.body;
  var fondo = document.getElementById('fondo');
  var lc = document.getElementById('color');
  var lt = document.getElementById('truco');
  var crono = document.getElementById('crono');
  var log = document.getElementById('log');

  function pinta(t) {
    var c = PAL[i];
    fondo.style.background = c[1];
    var claro = (c[0] === 'azul' || c[0] === 'negro' || c[0] === 'rojo' || c[0] === 'magenta');
    fondo.style.color = claro ? '#fff' : '#000';
    log.style.color = fondo.style.color;
    lc.textContent = c[0];
    lt.textContent = 'truco ' + t;
    log.textContent = (log.textContent + ' · ' + t + ':' + c[0]).slice(-90);
    t0 = performance.now();
  }
  // Cronómetro: décimas desde el último toque. Solo cambia texto, en caja fija.
  setInterval(function () { crono.textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' s'; }, 100);

  function ref() { // F: 1px arriba y revertir al siguiente frame (dos layouts, dos frames)
    body.style.paddingTop = '1px'; void body.offsetHeight;
    requestAnimationFrame(function () { body.style.paddingTop = '0'; });
  }
  function sinc() { // G: ida y vuelta síncrona, dos layouts en la misma tarea
    body.style.paddingTop = '1px'; void body.offsetHeight;
    body.style.paddingTop = '0';   void body.offsetHeight;
  }
  function theme() { // pone theme-color al color actual
    if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
    meta.content = PAL[i][1];
  }
  function grande() { fondo.classList.toggle('grande'); void body.offsetHeight; }

  var T = {
    '0': function () {},
    'F': ref,
    'G': sinc,
    'H': function () { theme(); ref(); },
    'K': grande
  };

  var barra = document.getElementById('barra');
  barra.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var t = b.getAttribute('data-t');
    if (t === 'I') {
      if (auto) { clearInterval(auto); auto = null; b.classList.remove('on'); lt.textContent = 'auto apagado'; }
      else { auto = setInterval(ref, 300); b.classList.add('on'); lt.textContent = 'auto ENCENDIDO: ahora toca 0'; }
      return;
    }
    if (t === 'R') { fondo.classList.remove('grande'); body.style.paddingTop = '0'; lt.textContent = 'reset'; return; }
    if (t === 'J') return; // J va por touchstart, abajo
    i = (i + 1) % PAL.length;
    pinta(t);
    T[t]();
  });
  // J: color + F en touchstart, antes de que el toque termine (¿ganamos tiempo?)
  barra.addEventListener('touchstart', function (e) {
    var b = e.target.closest('button');
    if (!b || b.getAttribute('data-t') !== 'J') return;
    i = (i + 1) % PAL.length;
    pinta('J');
    ref();
  }, { passive: true });

  pinta('inicio');
})();
</script>
</body>
</html>
