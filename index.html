*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  overflow: hidden;
}

body {
  font-family: "Helvetica Neue LT Std", "Helvetica Neue", Helvetica, sans-serif;
  font-weight: 700;
  -webkit-font-smoothing: antialiased;
}

/* .slide es flex, así que el display:none del UA para [hidden] no basta. */
[hidden] { display: none !important; }

.slide {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 24px;
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

@media (min-width: 768px) {
  .slide { padding: 0 48px; }
}

.line {
  margin: 0;
  font-size: max(18px, 2.168vw);
  line-height: 1.15;
  text-align: center;
  text-wrap: balance;
}

/* 900 resuelve al corte 85 Heavy declarado arriba. */
.heavy { font-weight: 900; }

/* El contorno lo dibuja la propia fuente: es un corte, no un efecto CSS. */
.outline { font-family: "Helvetica Neue LT Std Outline", "Helvetica Neue LT Std", "Helvetica Neue", Helvetica, sans-serif; }

/* Devuelve a Bold sólido el tramo marcado dentro de una línea .outline. */
.solid { font-family: "Helvetica Neue LT Std", "Helvetica Neue", Helvetica, sans-serif; }

a {
  color: inherit;
  text-decoration: none;
  user-select: text;
  -webkit-user-select: text;
  -webkit-tap-highlight-color: transparent;
}

.underline {
  text-decoration: underline;
  text-decoration-thickness: 0.096em;
  text-underline-offset: 0.14em;
}

.logo {
  display: block;
  height: 7.33em;
  width: auto;
  fill: currentColor;
}
</style>

<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var actual = 0;

  function mostrar(n) {
    actual = (n + slides.length) % slides.length;
    for (var k = 0; k < slides.length; k++) slides[k].hidden = k !== actual;
    // Sin theme-color a propósito: el navegador incrustado de Instagram
    // estrangula sus cambios y deja la barra una slide por detrás. Sin meta,
    // Safari tiñe la barra a partir de este fondo e Instagram cae a negro.
    var bg = getComputedStyle(slides[actual]).getPropertyValue('--bg').trim();
    document.documentElement.style.backgroundColor = bg;
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    mostrar(actual + 1);
  });

  // Swipe en móvil: cualquier dirección avanza. No se distingue el eje, solo
  // el recorrido, así que arriba, abajo, izquierda y derecha hacen lo mismo.
  var UMBRAL = 30;
  var origen = null;

  document.addEventListener('touchstart', function (e) {
    // Un gesto de dos dedos (pellizco para hacer zoom) no es un swipe.
    origen = e.touches.length === 1 ? e.changedTouches[0] : null;
  }, { passive: true });

  // Este listener NO puede ser pasivo: necesita preventDefault.
  document.addEventListener('touchend', function (e) {
    if (!origen) return;
    var fin = e.changedTouches[0];
    var dx = fin.clientX - origen.clientX;
    var dy = fin.clientY - origen.clientY;
    origen = null;
    // Por debajo del umbral fue un toque: se deja pasar y ya avanza el clic.
    if (Math.sqrt(dx * dx + dy * dy) < UMBRAL) return;
    // Corta el clic sintético que el navegador dispararía después. Sin esto se
    // avanzarían dos slides de golpe, y un swipe sobre un enlace lo abriría.
    e.preventDefault();
    mostrar(actual + 1);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      mostrar(actual + 1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      mostrar(actual - 1);
    }
  });

  mostrar(0);
})();
</script>
