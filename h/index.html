<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagnóstico v5</title>
<style>
html, body { margin: 0; overflow: hidden; }
body { font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
/* Como la landing: la capa de color en el flujo, 100dvh. Tocarla cambia de color. */
#fondo { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#fondo b { font-size: 11vw; }
#fondo small { font-size: 4.5vw; opacity: .85; margin-top: .6em; }
/* La franja: fija arriba, por encima de todo, altura y color ajustables. */
#franja { position: fixed; top: 0; left: 0; right: 0; height: 0; background: #000; z-index: 2; }
#log { position: fixed; left: 8px; right: 8px; bottom: 150px; font-size: 12px; opacity: .75; text-align: center; word-break: break-all; }
#barra { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.78); z-index: 3; }
#barra button { font: 600 13px/1.15 -apple-system, system-ui, sans-serif; padding: 12px 3px; border: 0; border-radius: 10px; background: #fff; color: #000; -webkit-tap-highlight-color: transparent; }
#barra button.on { background: #ffd400; }
</style>
</head>
<body>
<div id="franja"></div>
<div id="fondo"><b id="color">—</b><small id="truco">toca aquí para cambiar de color</small></div>
<div id="log"></div>
<div id="barra">
  <button data-h="0" class="on">0 px</button>
  <button data-h="1">1 px</button>
  <button data-h="2">2 px</button>
  <button data-h="4">4 px</button>
  <button data-h="8">8 px</button>
  <button data-h="16">16 px</button>
  <button data-h="32">32 px</button>
  <button data-c="1">negro / blanco</button>
</div>
<script>
(function () {
  var PAL = [['azul','#0017C3'],['rosa','#FFA3DC'],['lima','#BFED34'],['rojo','#FF3E3E'],['cian','#49FFED'],['magenta','#FF27EC'],['negro','#000000'],['blanco','#FFFFFF']];
  var i = 0, h = 0, blanco = false;
  var fondo = document.getElementById('fondo');
  var franja = document.getElementById('franja');
  var lc = document.getElementById('color');
  var lt = document.getElementById('truco');
  var log = document.getElementById('log');

  function estado() { return h + 'px ' + (blanco ? 'blanco' : 'negro'); }
  function pinta() {
    var c = PAL[i];
    fondo.style.background = c[1];
    var claro = (c[0] === 'azul' || c[0] === 'negro' || c[0] === 'rojo' || c[0] === 'magenta');
    fondo.style.color = claro ? '#fff' : '#000';
    log.style.color = fondo.style.color;
    lc.textContent = c[0];
    lt.textContent = 'franja ' + estado() + ' — toca para cambiar';
    log.textContent = (log.textContent + ' · ' + c[0] + '[' + estado() + ']').slice(-90);
  }

  // Tocar la zona de color = siguiente color, sin ningún truco.
  fondo.addEventListener('click', function () { i = (i + 1) % PAL.length; pinta(); });

  var barra = document.getElementById('barra');
  barra.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-c')) {
      blanco = !blanco;
      franja.style.background = blanco ? '#fff' : '#000';
      b.classList.toggle('on', blanco);
    } else {
      h = parseInt(b.getAttribute('data-h'), 10);
      franja.style.height = h + 'px';
      Array.prototype.forEach.call(barra.querySelectorAll('[data-h]'), function (x) { x.classList.toggle('on', x === b); });
    }
    lt.textContent = 'franja ' + estado() + ' — ahora toca el color varias veces';
  });

  pinta();
})();
</script>
</body>
</html>
