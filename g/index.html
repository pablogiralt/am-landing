<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagnóstico v4</title>
<style>
html, body { margin: 0; }
/* Desbordamiento GARANTIZADO: el documento mide 100dvh + 300px, así que hay
   300px reales que scrollear aunque el webview sea más alto de lo que dice dvh. */
body { height: calc(100dvh + 300px); font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
/* La capa de color es fija: el scroll mueve el documento pero no se ve nada. */
#fondo { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#fondo b { font-size: 11vw; }
#fondo small { font-size: 4.5vw; opacity: .85; margin-top: .6em; }
#log { position: fixed; left: 8px; right: 8px; bottom: 150px; font-size: 12px; opacity: .75; text-align: center; word-break: break-all; }
#barra { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.78); }
#barra button { font: 600 13px/1.15 -apple-system, system-ui, sans-serif; padding: 12px 3px; border: 0; border-radius: 10px; background: #fff; color: #000; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="fondo"><b id="color">—</b><small id="truco">toca un botón</small></div>
<div id="log"></div>
<div id="barra">
  <button data-t="0">0<br>nada</button>
  <button data-t="S1">S1<br>20px y vuelta</button>
  <button data-t="S2">S2<br>0↔20 se queda</button>
  <button data-t="S3">S3<br>suave</button>
  <button data-t="S4">S4<br>+1px acumula</button>
  <button data-t="S5">S5<br>al apoyar</button>
  <button data-t="F">F<br>geom (ref)</button>
  <button data-t="R">R<br>reset</button>
</div>
<script>
(function () {
  var PAL = [['azul','#0017C3'],['rosa','#FFA3DC'],['lima','#BFED34'],['rojo','#FF3E3E'],['cian','#49FFED'],['magenta','#FF27EC'],['negro','#000000'],['blanco','#FFFFFF']];
  var i = 0, alt = false;
  var body = document.body;
  var fondo = document.getElementById('fondo');
  var lc = document.getElementById('color');
  var lt = document.getElementById('truco');
  var log = document.getElementById('log');

  function pinta(t) {
    var c = PAL[i];
    fondo.style.background = c[1];
    var claro = (c[0] === 'azul' || c[0] === 'negro' || c[0] === 'rojo' || c[0] === 'magenta');
    fondo.style.color = claro ? '#fff' : '#000';
    log.style.color = fondo.style.color;
    lc.textContent = c[0];
    lt.textContent = 'truco ' + t;
    // El log incluye scrollY para demostrar que el scroll se movió de verdad.
    log.textContent = (log.textContent + ' · ' + t + ':' + c[0] + '@' + Math.round(window.scrollY)).slice(-90);
  }

  var T = {
    '0':  function () {},
    'S1': function () { window.scrollTo(0, 20); requestAnimationFrame(function () { window.scrollTo(0, 0); }); },
    'S2': function () { alt = !alt; window.scrollTo(0, alt ? 20 : 0); },
    'S3': function () { window.scrollTo({ top: 20, behavior: 'smooth' }); setTimeout(function () { window.scrollTo({ top: 0, behavior: 'smooth' }); }, 350); },
    'S4': function () { window.scrollBy(0, 1); },
    'F':  function () { body.style.paddingTop = '1px'; void body.offsetHeight; requestAnimationFrame(function () { body.style.paddingTop = '0'; }); }
  };

  var barra = document.getElementById('barra');
  barra.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var t = b.getAttribute('data-t');
    if (t === 'R') { window.scrollTo(0, 0); body.style.paddingTop = '0'; lt.textContent = 'reset'; return; }
    if (t === 'S5') return;
    i = (i + 1) % PAL.length;
    T[t]();          // el scroll primero
    pinta(t);        // y el log ya recoge el scrollY resultante
  });
  // S5: color + scroll de 20px y vuelta, al apoyar el dedo.
  barra.addEventListener('touchstart', function (e) {
    var b = e.target.closest('button');
    if (!b || b.getAttribute('data-t') !== 'S5') return;
    i = (i + 1) % PAL.length;
    T['S1']();
    pinta('S5');
  }, { passive: true });

  pinta('inicio');
})();
</script>
</body>
</html>
